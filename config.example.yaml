# esAdb 配置示例
# 复制为 config.yaml 后填写真实连接信息
# 优先级：环境变量(ESADB_*) > config.yaml

server:
  addr: ":8080"

log:
  level: info # debug|info|warn|error|off

es:
  url: "http://127.0.0.1:9200"
  index: "ysh-ysh-app-info*"
  username: ""
  password: ""
  method: "addEventLog"
  fields: "content"
  dateField: "@timestamp"

mysql:
  host: "127.0.0.1"
  port: 3306
  user: "root"
  password: "password"
  database: "esadb"
  table: "app_event_log"

sync:
  interval: 10   # 可改为 5
  max_size: 10000
  max_time: 10
  max_retry: 3
  retry_delay: 1
  retry_delay_max: 10
