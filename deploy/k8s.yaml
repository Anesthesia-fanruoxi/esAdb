# es-adb K8s 部署（namespace: metabase）
# 1. 先生成 ConfigMap: .\scripts\gen-configmap.ps1
# 2. kubectl apply -f deploy/configmap.yaml
# 3. kubectl apply -f deploy/k8s.yaml

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: es-adb
  namespace: metabase
  labels:
    app: es-adb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: es-adb
  template:
    metadata:
      labels:
        app: es-adb
    spec:
      containers:
        - name: es-adb
          image: prohub.hzbxhd.com/middleware/es-adb:1.0
          imagePullPolicy: Always
          args: ["-c", "/config/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: es-adb-config

---
apiVersion: v1
kind: Service
metadata:
  name: es-adb
  namespace: metabase
  labels:
    app: es-adb
spec:
  type: ClusterIP
  selector:
    app: es-adb
  ports:
    - name: http
      port: 8080
      targetPort: http
